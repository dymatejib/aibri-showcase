# Стиль витрины — машиной, а не договорённостью: правило, которое не проверяется,
# живёт до первой спешки (тот же принцип, что и у стражей в guards/).
#
# 100 знаков, а не 79: код здесь читают вместе с русскими комментариями, и перенос
# ради лишних двадцати знаков рвёт мысль чаще, чем помогает.
line-length = 100
target-version = "py310"

[lint]
# E/W — pycodestyle, F — pyflakes (мёртвые импорты и имена), I — порядок импортов.
select = ["E", "W", "F", "I"]

[lint.isort]
known-first-party = ["aibri", "guards"]
